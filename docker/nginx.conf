server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation required by the WASM geometry worker
    # (matches the Vite dev server headers). `always` so they apply to
    # every response, including the worker script and the .wasm asset.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # .wasm MIME type is provided by nginx's bundled mime.types (>=1.21),
    # inherited here — no override needed.

    location / {
        try_files $uri $uri/ /index.html;
    }
}
