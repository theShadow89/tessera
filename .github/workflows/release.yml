name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Produces:
#   - desktop installers (.dmg / .msi / .deb / AppImage) attached to a GitHub Release
#   - a web container image on GHCR (ghcr.io/<owner>/<repo>)
# workflow_dispatch lets you run it manually against the current ref for testing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Cancel superseded runs for the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: nothing is released unless tests pass and the web bundle builds.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Desktop installers, one native runner per OS. Tauri cannot cross-compile,
  # so each target builds on its own OS. macOS builds a universal binary.
  desktop:
    needs: test
    permissions:
      contents: write # create the release and upload installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (WebKitGTK, etc.)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf \
            build-essential \
            curl wget file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      # Generate app icons from the committed source PNG. tauri build requires
      # icons; they are not committed (see src-tauri/icons/README.md).
      - name: Generate app icons
        run: npx tauri icon src-tauri/app-icon.png

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tessera ${{ github.ref_name }}
          releaseBody: |
            Desktop installers for macOS, Windows and Linux are attached below.
            Builds are unsigned: macOS Gatekeeper / Windows SmartScreen will warn
            on first launch (open manually to allow).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Web app as a container image, served by nginx with the cross-origin
  # isolation headers the WASM worker needs. Published to GHCR.
  web:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
